<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./packages/gera-ds/src/assets/gera-app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GERA, a engrenagem social do Comitê Social ACIJS em Jaraguá do Sul." />
    <title>GERA · Comitê Social ACIJS</title>
    <script>
      // Aplica o tema antes do React montar, para a página não piscar clara no tema escuro.
      // Mesma regra de src/lib/theme.tsx.
      (function () {
        var t = null;
        try { t = localStorage.getItem('gera.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
