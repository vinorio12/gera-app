# Build e testes a cada push e pull request: checagem de cores, tipos, build, Vitest e Playwright.
name: CI

on:
  push:
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (cores, tipos e Vite)
        run: npm run build

      - name: Testes de unidade (Vitest)
        run: npm test

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de navegador e acessibilidade (Playwright + axe)
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
